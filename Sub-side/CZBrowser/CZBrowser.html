<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CZ Studio Browser</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/jpg" href="CZ Studio.jpg"

</head>
<body>
  <div class="container">
    <!-- LOGO 区域 -->
    <div class="logo">
      <img src="CZLOGO PNG.png" alt="CZ Studio Logo" onerror="this.src='https://placehold.co/60x60/0a2a44/4da3ff?text=CZ'">
      <span>CZ Browser</span>
    </div>

    <!-- 搜索框 -->
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="搜索和网址自动识别" autofocus>
      <button id="searchBtn">Go</button>
    </div>

    <!-- 搜索引擎切换-->
    <div class="engine-selector">
      <span data-engine="baidu" class="engine-option active">Baidu</span>
      <span data-engine="bing" class="engine-option">Bing</span>
      <span data-engine="google" class="engine-option">Google</span>
    </div>

    <!-- 快捷链接 -->
    <div class="quick-links">
      <a href="https://czstudio.top" target="_parent">CZ STUDIO Website</a>
      <a href="https://bilibili.com" target="_blank">Bilibili</a>
      <a href="https://www.douyin.com" target="_blank">抖音</a>
      <a href="https://www.github.com" target="_blank">GitHub</a>
      <a href="https://www.youtube.com" target="_blank">YouTube</a>
    </div>

    <!-- 底部装饰：日期/问候 (可选) -->
    <div class="footer-note">
      <span id="greetingText">✨ 探索无限可能</span>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
