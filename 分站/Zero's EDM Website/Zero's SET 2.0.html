<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CZ Studio Music</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  body {
    font-family: 'Arial', sans-serif;
    background-color: #0d0d0d;
    color: #f5f5f5;
    overflow-x: hidden;
  }
  a { text-decoration: none; color: #f5f5f5; }
  header {
    background-color: #111;
    padding: 1rem 0;
    position: sticky;
    top: 0;
    z-index: 1000;
  }
  header nav a { margin: 0 1rem; font-weight: bold; }

  /* 黑色渐变入场遮罩层 */
  .overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: linear-gradient(135deg, #000, #111);
    z-index: 9999;
    animation: fadeOut 1.5s forwards;
  }
  @keyframes fadeOut { 0% {opacity:1;} 100% {opacity:0; visibility:hidden;} }

  /* 页面内容渐入 */
  .page-content {
    opacity: 0;
    animation: appear 1s forwards;
    animation-delay: 1.5s;
  }
  @keyframes appear { from {opacity:0; transform:translateY(20px);} to {opacity:1; transform:translateY(0);} }

  /* 音乐列表样式 */
  .music-card {
    background-color: #1a1a1a;
    border: none;
    padding: 1rem;
    margin-bottom: 1rem;
    border-radius: 8px;
  }
  audio { width: 100%; margin-top: 0.5rem; }
</style>
</head>
<body>

<!-- 遮罩层 -->
<div class="overlay"></div>

<!-- 页面内容 -->
<div class="page-content">

<header>
  <div class="container d-flex justify-content-between align-items-center">
    <h2 class="m-0">CZ Studio Music</h2>
    <nav>
      <a href="CZ Studio EDM.html">首页</a>
    </nav>
  </div>
</header>

<section class="section">
  <div class="container">
    <h2 class="text-center mb-4">SET</h2>
    
    <div class="music-card">
  <h5>Zero's SET 2.0</h5>
  <p>Progressive House</p>
  <img src="img\Zero 2.0.jpg" alt="Zero's SET 2.0"style="width: 150px;">
  <audio controls>
    <source src="Music\Zero's SET 2.0.flac" type="audio/mpeg">
    您的浏览器不支持音频播放。
  </audio>
  <a href="Music\Zero's SET 2.0.flac" download class="btn btn-outline-light btn-sm mt-2">下载</a>
</div>

</section>

</footer>

</html>
