<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EDM Studio by CZ</title>
  <link rel="icon" type="image/png" href="img\EDM Studio.jpg">
  <!-- 引入 Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background-color: #0d0d0d;
      color: #f5f5f5;
      overflow-x: hidden;
    }
    a { text-decoration: none; color: #f5f5f5; }
    header {
      background-color: #111;
      padding: 1rem 0;
      position: sticky;
      top: 0;
      z-index: 1000;
    }
    header nav a { margin: 0 1rem; font-weight: bold; }
    .hero {
      height: 80vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      background: linear-gradient(135deg, #ff416c, #ff4b2b);
    }
    .hero h1 { font-size: 3rem; margin-bottom: 1rem; }
    .hero p { font-size: 1.2rem; }
    .section { padding: 4rem 0; }
    .card { background-color: #1a1a1a; border: none; }
    footer { background-color: #111; padding: 2rem 0; text-align: center; }

    /* 黑色渐变入场遮罩层 */
    .overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: linear-gradient(135deg, #000, #111);
      z-index: 9999;
      animation: fadeOut 1.5s forwards;
    }

    @keyframes fadeOut {
      0% { opacity: 1; }
      100% { opacity: 0; visibility: hidden; }
    }

    /* 页面内容渐入效果 */
    .page-content {
      opacity: 0;
      animation: appear 1s forwards;
      animation-delay: 1.5s; /* 遮罩层动画结束后显示 */
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- 黑色渐变遮罩层 -->
  <div class="overlay"></div>

  <!-- 页面内容包裹 -->
  <div class="page-content">

    <!-- Header -->
    <header>
      <div class="container d-flex justify-content-between align-items-center">
        <h2 class="m-0">EDM Studio</h2>
        <nav>
          <a href="#about">About Me</a>
          <a href="#music">Zero's SET</a>
          <a href="../../index.html">返回首页</a>
          <a href="#">返回顶部</a>
        </nav>
      </div>
    </header>

    <!-- Hero Section -->
    <section class="hero">
      <div class="container">
        <h1>LCZero
          <img src="img\EDM StudioPNG LOGO.png" alt="" width="200">
        </h1>
        <p>EDM | Progressive House |</p>
      </div>
    </section>

    <!-- About Section -->
    <section id="about" class="section">
      <div class="container">
        <h2 class="text-center mb-4">About me</h2>
        <p class="text-center">暂未上线</p>
      </div>
    </section>

    <!-- Music Section -->
    <section id="music" class="section bg-dark">
      <div class="container">
        <h2 class="text-center mb-5">音乐作品</h2>
        <div class="row g-4">
          <div class="col-md-4">
            <!-- 字体亮度 -->
            <div class="card p-3 text-light">
              <h5>Zero's SET 2.0</h5>
              <p>Progressive House</p>
              <a href="#" class="btn btn-outline-light btn-sm disabled">敬请期待</a>
            </div>
          </div>
          <div class="col-md-4">
            <div class="card p-3">
              <h5>Zero's SET 24.10.26</h5>
              <a href="#" class="btn btn-outline-light btn-sm disabled">敬请期待</a>
            </div>
          </div>
          <div class="col-md-4">
            <div class="card p-3">
              <h5>Zero's SET 3.0</h5>
              <a href="#" class="btn btn-outline-light btn-sm disabled">敬请期待</a>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Contact Section -->
    <section id="contact" class="section">
      <div class="container">
        <h2 class="text-center mb-4">我还不清楚下面要开发什么...</h2>
        <form class="mx-auto" style="max-width:500px;">
          <div class="mb-3">
            <input type="text" class="form-control" placeholder="？" required>
          </div>
          <div class="mb-3">
            <input type="email" class="form-control" placeholder="？" required>
          </div>
          <div class="mb-3">
            <textarea class="form-control" rows="4" placeholder="？" required></textarea>
          </div>
          <button type="submit" class="btn btn-outline-light w-100 disabled">敬请期待</button>
        </form>
      </div>
    </section>

    <!-- Footer -->
    <footer>
      <p>&copy; 2025 CZ Studio. All Rights Reserved.</p>
      <p>
        <a href="#">QQ</a> | 
        <a href="#">Wechat</a> | 
        <a href="#">Douyin</a>
      </p>
    </footer>

  </div>
